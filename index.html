<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YKS Takip">
    <meta name="theme-color" content="#0f172a">

    <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/isometric/512/graduation-cap.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/isometric/512/graduation-cap.png">

    <title>YKS Hazırlık ve Takip</title>

    <!-- Firebase SDK (Bulut Bağlantısı) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: calc(env(safe-area-inset-top) + 15px) 15px calc(env(safe-area-inset-bottom) + 20px) 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #38bdf8;
            font-weight: 700;
        }

        .status-badge {
            font-size: 0.75rem;
            background: #0284c7;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 5px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
            .full-width {
                grid-column: span 2;
            }
        }

        .card {
            background: #1e293b;
            padding: 18px;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #f1f5f9;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .counter-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px 18px;
            border-radius: 12px;
            margin-top: 10px;
        }

        .counter-btn {
            background: #0284c7;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
        }

        .counter-btn:active {
            transform: scale(0.95);
            background: #0369a1;
        }

        .count-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .topic-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 220px;
            overflow-y: auto;
        }

        .topic-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
            font-size: 0.95rem;
        }

        .topic-item:last-child {
            border-bottom: none;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #38bdf8;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #f8fafc;
            padding: 10px;
            font-family: inherit;
            resize: none;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: 1px solid #38bdf8;
        }

        .progress-bar {
            width: 100%;
            background: #0f172a;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: #38bdf8;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <header>
        <h1>YKS Çalışma Takibi</h1>
        <div class="status-badge" id="syncStatus">Bulut Bağlantısı Kuruluyor...</div>
    </header>

    <div class="container">

        <!-- Günlük Soru Sayacı -->
        <div class="card">
            <h2>Günlük Çözülen Soru</h2>
            <div class="counter-box">
                <button class="counter-btn" onclick="updateQuestions(-10)">-10</button>
                <span class="count-display" id="questionCount">0</span>
                <button class="counter-btn" onclick="updateQuestions(10)">+10</button>
            </div>
        </div>

        <!-- Genel İlerleme -->
        <div class="card">
            <h2>AYT Matematik İlerleme</h2>
            <div id="progressText" style="font-size: 0.9rem; color: #94a3b8;">0 / 5 Konu Tamamlandı</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- AYT Matematik Konu Takibi -->
        <div class="card full-width">
            <h2>AYT Matematik Hedef Konular</h2>
            <ul class="topic-list">
                <li class="topic-item"><input type="checkbox" onchange="saveTopics()" class="topic-cb"> Fonksiyonlar & Parabol</li>
                <li class="topic-item"><input type="checkbox" onchange="saveTopics()" class="topic-cb"> Polinomlar</li>
                <li class="topic-item"><input type="checkbox" onchange="saveTopics()" class="topic-cb"> Trigonometri</li>
                <li class="topic-item"><input type="checkbox" onchange="saveTopics()" class="topic-cb"> Türev</li>
                <li class="topic-item"><input type="checkbox" onchange="saveTopics()" class="topic-cb"> İntegral</li>
            </ul>
        </div>

        <!-- Hızlı Notlar -->
        <div class="card full-width">
            <h2>Bugünün Notları & Unutulmaması Gerekenler</h2>
            <textarea id="dailyNotes" placeholder="Formülleri veya yapacaklarını buraya not al..." oninput="saveNotes()"></textarea>
        </div>

    </div>

    <script>
        // Firebase Yapılandırması (Otomatik Aktarıldı)
        const firebaseConfig = {
            apiKey: "AIzaSyA_R0bm-zfNMMJngyD91SvqRJAw1ZePY8A",
            authDomain: "yks-takip-e070d.firebaseapp.com",
            databaseURL: "https://yks-takip-e070d-default-rtdb.firebaseio.com",
            projectId: "yks-takip-e070d",
            storageBucket: "yks-takip-e070d.firebasestorage.app",
            messagingSenderId: "422766842394",
            appId: "1:422766842394:web:67f0d0907d5cd33bb637a3"
        };

        // Firebase Başlatma
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentQuestionCount = 0;

        // Bulut Verisi Dinleyici (Canlı Senkronizasyon)
        db.ref('yks_data').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.questions !== undefined) {
                    currentQuestionCount = data.questions;
                    document.getElementById('questionCount').innerText = currentQuestionCount;
                }
                if (data.notes !== undefined && document.activeElement !== document.getElementById('dailyNotes')) {
                    document.getElementById('dailyNotes').value = data.notes;
                }
                if (data.topics) {
                    const checkboxes = document.querySelectorAll('.topic-cb');
                    checkboxes.forEach((cb, index) => {
                        cb.checked = !!data.topics['topic_' + index];
                    });
                    updateProgressBar();
                }
            }
            document.getElementById('syncStatus').innerText = "☁️ Canlı Senkronize";
            document.getElementById('syncStatus').style.background = "#16a34a";
        });

        function updateQuestions(val) {
            currentQuestionCount = Math.max(0, currentQuestionCount + val);
            document.getElementById('questionCount').innerText = currentQuestionCount;
            db.ref('yks_data/questions').set(currentQuestionCount);
        }

        function saveNotes() {
            const notes = document.getElementById('dailyNotes').value;
            db.ref('yks_data/notes').set(notes);
        }

        function saveTopics() {
            const checkboxes = document.querySelectorAll('.topic-cb');
            let topicData = {};
            checkboxes.forEach((cb, index) => {
                topicData['topic_' + index] = cb.checked;
            });
            db.ref('yks_data/topics').set(topicData);
            updateProgressBar();
        }

        function updateProgressBar() {
            const checkboxes = document.querySelectorAll('.topic-cb');
            let checkedCount = 0;
            checkboxes.forEach((cb) => {
                if(cb.checked) checkedCount++;
            });

            const percent = (checkedCount / checkboxes.length) * 100;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').innerText = checkedCount + ' / ' + checkboxes.length + ' Konu Tamamlandı';
        }
    </script>

</body>
</html>
